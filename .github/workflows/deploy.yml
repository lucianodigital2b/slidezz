name: deploy

# Depois que o workflow "tests" passa na main, entra por SSH na VPS e roda
# /home/slidezz/deploy.sh (cópia em deploy/deploy.sh). A chave só pode rodar esse script.
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY   chave PRIVADA dedicada (github-actions@slidezz); a pública está
#                    no ~/.ssh/authorized_keys do user slidezz, presa ao deploy.sh
#   DEPLOY_HOST      IP da VPS

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key "slidezz@${{ secrets.DEPLOY_HOST }}" "$SHA"

      - name: Confere a versão no ar
        run: |
          sleep 3
          LIVE=$(curl -fsS "https://slidezz.app/REVISION" | tr -d '[:space:]')
          echo "no ar: $LIVE | esperado: $SHA"
          test "$LIVE" = "$SHA"

      - name: Limpa a chave
        if: always()
        run: rm -f ~/.ssh/deploy_key
